name: Déploiement GitHub Pages

# Déclenché à chaque push sur la branche principale.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # permet un déclenchement manuel depuis l'onglet Actions

# Permissions nécessaires pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois. On ANNULE un déploiement resté en cours :
# évite qu'un vieux run bloqué tienne le verrou et coince tous les suivants.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'app
        run: npm run build

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact (dossier dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
