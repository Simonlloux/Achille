name: Déploiement GitHub Pages

# Déclenché à chaque push sur la branche principale.
on:
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel possible depuis l'onglet Actions

# Le workflow doit pouvoir écrire dans le dépôt (pousser sur gh-pages).
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'app
        run: npm run build

      # Publie le contenu de dist/ sur la branche gh-pages.
      # GitHub Pages sert ensuite cette branche directement (pas d'environnement
      # protégé, donc pas de blocage possible en « queued »).
      - name: Déploiement sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Empêche Jekyll de traiter les fichiers (nécessaire pour un build Vite).
          enable_jekyll: false
